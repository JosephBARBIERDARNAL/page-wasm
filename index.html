<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>page — PDF validation demo</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f8f5;
        --surface: #ffffff;
        --text: #18201f;
        --muted: #687573;
        --border: #dce3df;
        --accent: #126b59;
        --accent-soft: #e4f1ec;
        --warning: #94631d;
        --warning-soft: #fff5df;
        --error: #a13939;
        --error-soft: #fff0ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--background);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .page {
        width: min(680px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 72px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 72px;
      }

      .brand {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .brand span {
        display: inline-grid;
        width: 24px;
        height: 24px;
        margin-right: 8px;
        place-items: center;
        color: white;
        background: var(--accent);
        border-radius: 6px;
        font-size: 0.75rem;
      }

      .header-note,
      .label,
      .status,
      .profile,
      .report-code {
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.7rem;
      }

      .header-note {
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .intro {
        margin-bottom: 30px;
      }

      .kicker {
        margin: 0 0 12px;
        color: var(--accent);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.4rem);
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .intro p {
        max-width: 500px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .panel {
        padding: 24px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 14px;
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .panel-heading h2 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: -0.02em;
      }

      .status {
        color: var(--accent);
      }

      .file-picker {
        display: block;
        padding: 28px 20px;
        border: 1px dashed #b7c9c2;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
      }

      .file-picker:hover,
      .file-picker:focus-within,
      .file-picker.is-dragging {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .file-picker input {
        display: block;
        width: min(100%, 300px);
        margin: 0 auto 10px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .file-name {
        min-height: 1.2em;
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .file-name.has-file {
        color: var(--accent);
        font-weight: 600;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
        margin-top: 18px;
      }

      .label {
        display: block;
        margin-bottom: 7px;
      }

      select,
      button {
        min-height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        font: inherit;
        font-size: 0.8rem;
      }

      select {
        width: 100%;
        color: var(--text);
        border: 1px solid var(--border);
        background: var(--surface);
      }

      button {
        border: 1px solid var(--accent);
        font-weight: 650;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      button.loading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .spinner {
        display: none;
        width: 13px;
        height: 13px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
      }

      button.loading .spinner {
        display: inline-block;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .button-row {
        display: flex;
        gap: 8px;
      }

      .secondary {
        color: var(--accent);
        background: var(--surface);
      }

      .primary {
        color: white;
        background: var(--accent);
      }

      .message {
        display: none;
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .message.visible {
        display: block;
      }

      .message.error {
        color: var(--error);
        background: var(--error-soft);
      }

      .report {
        display: none;
        margin-top: 18px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
      }

      .report.visible {
        display: block;
      }

      .report-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
      }

      .report h2 {
        margin: 0;
        color: var(--accent);
        font-size: 1.25rem;
        letter-spacing: -0.04em;
      }

      .report h2.failed {
        color: var(--warning);
      }

      .profile {
        color: var(--muted);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin: 18px 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .stats strong {
        margin-right: 4px;
        color: var(--text);
        font-weight: 650;
      }

      .failures {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .failure {
        padding: 10px 12px;
        color: var(--warning);
        background: var(--warning-soft);
        border-radius: 7px;
        font-size: 0.75rem;
        line-height: 1.45;
      }

      .failure code {
        display: block;
        margin-bottom: 3px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.65rem;
      }

      .report-code {
        display: block;
        margin-top: 16px;
      }

      .hint {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.5;
      }

      @media (max-width: 520px) {
        .page {
          padding-top: 24px;
        }

        header {
          margin-bottom: 52px;
        }

        .header-note {
          display: none;
        }

        .panel {
          padding: 17px;
        }

        .options {
          grid-template-columns: 1fr;
        }

        .button-row,
        button {
          width: 100%;
        }

        .stats {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section class="intro">
          <h1>PDF validation</h1>
        </section>

        <section class="panel" aria-labelledby="test-heading">
          <div class="panel-heading">
            <h2 id="test-heading">Input</h2>
            <span class="status" id="status">ready</span>
          </div>

          <label class="file-picker" id="file-picker" for="file-input">
            <input id="file-input" type="file" accept="application/pdf,.pdf" />
            <p class="file-name" id="file-name">No PDF selected</p>
          </label>

          <div class="options">
            <label>
              <span class="label">Profile</span>
              <select id="profile">
                <option value="1b">PDF/A-1b</option>
                <option value="1a">PDF/A-1a</option>
                <option value="2b">PDF/A-2b</option>
                <option value="2a">PDF/A-2a</option>
                <option value="2u">PDF/A-2u</option>
                <option value="3b">PDF/A-3b</option>
                <option value="3a">PDF/A-3a</option>
                <option value="3u">PDF/A-3u</option>
                <option value="ua1">PDF/UA-1</option>
              </select>
            </label>
            <div class="button-row">
              <button class="secondary" id="sample-button" type="button">
                Use sample
              </button>
              <button class="primary" id="validate-button" type="button" disabled>
                <span class="spinner" aria-hidden="true"></span>
                <span id="validate-label">Validate</span>
              </button>
            </div>
          </div>

          <div class="message error" id="error" role="alert"></div>

          <section class="report" id="report" aria-live="polite">
            <div class="report-top">
              <h2 id="report-heading">Compliant</h2>
              <span class="profile" id="report-profile">PDF/A-1b</span>
            </div>
            <div class="stats">
              <span><strong id="total-checks">—</strong> checks</span>
              <span><strong id="passed-checks">—</strong> passed</span>
              <span><strong id="failed-checks">—</strong> findings</span>
              <span><strong id="validation-time">—</strong> time</span>
            </div>
            <ul class="failures" id="failures"></ul>
            <span class="report-code" id="report-code">exit 0</span>
          </section>
        </section>
      </main>
    </div>

    <script type="module">
      import { validatePdfBytes } from "/src/index.ts";

      const $ = (selector) => document.querySelector(selector);
      const fileInput = $("#file-input");
      const filePicker = $("#file-picker");
      const fileName = $("#file-name");
      const profile = $("#profile");
      const validateButton = $("#validate-button");
      const sampleButton = $("#sample-button");
      const validateLabel = $("#validate-label");
      const status = $("#status");
      const error = $("#error");
      let bytes;
      let currentName;

      const setStatus = (value, color = "var(--accent)") => {
        status.textContent = value;
        status.style.color = color;
      };

      const showError = (message) => {
        error.textContent = message;
        error.classList.toggle("visible", Boolean(message));
      };

      const setFile = (fileBytes, name) => {
        bytes = fileBytes;
        currentName = name;
        fileName.textContent = name;
        fileName.classList.add("has-file");
        validateButton.disabled = false;
        showError("");
        setStatus("ready");
      };

      const formatDuration = (milliseconds) =>
        milliseconds < 1
          ? "<1 ms"
          : milliseconds < 1000
            ? `${milliseconds.toFixed(0)} ms`
            : `${(milliseconds / 1000).toFixed(2)} s`;

      const minimalPdf = () => {
        const objects = [
          "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n",
          "2 0 obj\n<< /Type /Pages /Kids [] /Count 0 >>\nendobj\n",
        ];
        let data = "%PDF-1.4\n";
        const offsets = [];
        for (const object of objects) {
          offsets.push(data.length);
          data += object;
        }
        const xrefOffset = data.length;
        data += "xref\n0 3\n0000000000 65535 f \n";
        data += offsets
          .map((offset) => `${offset.toString().padStart(10, "0")} 00000 n \n`)
          .join("");
        return new TextEncoder().encode(
          `${data}trailer\n<< /Size 3 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`,
        );
      };

      const renderReport = (report) => {
        $("#report").classList.add("visible");
        $("#report-heading").textContent = report.isCompliant
          ? "Compliant"
          : "Findings detected";
        $("#report-heading").classList.toggle("failed", !report.isCompliant);
        $("#report-profile").textContent =
          profile.options[profile.selectedIndex].textContent;
        $("#total-checks").textContent = report.checks.total;
        $("#passed-checks").textContent = report.checks.passed;
        $("#failed-checks").textContent = report.failures.length;
        $("#report-code").textContent = `exit ${report.exitCode()} · ${currentName}`;
        const list = $("#failures");
        list.replaceChildren();
        for (const failure of report.failures) {
          const item = document.createElement("li");
          item.className = "failure";
          item.innerHTML = "<code></code><span></span>";
          item.querySelector("code").textContent = failure.ruleId;
          item.querySelector("span").textContent = failure.message;
          list.append(item);
        }
      };

      const loadFile = async (file) => {
        if (!file) return;
        if (
          file.type !== "application/pdf" &&
          !file.name.toLowerCase().endsWith(".pdf")
        ) {
          showError("Please select a PDF file.");
          setStatus("needs PDF", "var(--error)");
          return;
        }
        setFile(new Uint8Array(await file.arrayBuffer()), file.name);
      };

      const validate = async () => {
        if (!bytes) return;
        validateButton.disabled = true;
        validateButton.classList.add("loading");
        validateButton.setAttribute("aria-busy", "true");
        validateLabel.textContent = "Validating…";
        sampleButton.disabled = true;
        setStatus("running", "var(--warning)");
        showError("");
        await new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(resolve)),
        );
        const startedAt = performance.now();
        try {
          const report = await validatePdfBytes(bytes, profile.value);
          $("#validation-time").textContent = formatDuration(
            performance.now() - startedAt,
          );
          renderReport(report);
          setStatus(
            report.isCompliant ? "compliant" : "review findings",
            report.isCompliant ? "var(--accent)" : "var(--warning)",
          );
        } catch (validationError) {
          setStatus("error", "var(--error)");
          showError(validationError.message ?? String(validationError));
        } finally {
          validateButton.disabled = false;
          validateButton.classList.remove("loading");
          validateButton.removeAttribute("aria-busy");
          validateLabel.textContent = "Validate";
          sampleButton.disabled = false;
        }
      };

      fileInput.addEventListener("change", () => loadFile(fileInput.files?.[0]));
      ["dragenter", "dragover"].forEach((eventName) =>
        filePicker.addEventListener(eventName, (event) => {
          event.preventDefault();
          filePicker.classList.add("is-dragging");
        }),
      );
      ["dragleave", "drop"].forEach((eventName) =>
        filePicker.addEventListener(eventName, (event) => {
          event.preventDefault();
          filePicker.classList.remove("is-dragging");
        }),
      );
      filePicker.addEventListener("drop", (event) =>
        loadFile(event.dataTransfer.files?.[0]),
      );
      sampleButton.addEventListener("click", () =>
        setFile(minimalPdf(), "sample-minimal.pdf"),
      );
      validateButton.addEventListener("click", validate);
      window.addEventListener("error", (event) => showError(event.message));
    </script>
  </body>
</html>
